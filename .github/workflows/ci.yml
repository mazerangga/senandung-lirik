name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # Pustaka sistem yang dibutuhkan Qt agar bisa diimpor/dijalankan tanpa layar (offscreen).
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pyflakes

      - name: Lint (pyflakes)
        run: python -m pyflakes senandung.py players romanize tools tests

      - name: Shell syntax
        run: |
          bash -n packaging/linux/install-senandung.sh
          bash -n tools/build_appimage.sh

      - name: Build installers (also verifies the payload)
        run: python tools/build_installers.py --out "$RUNNER_TEMP/dist"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
